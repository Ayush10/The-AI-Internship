upstream week1 {
    server week1:8001;
}

upstream week2 {
    server week2:8002;
}

server {
    listen 80;
    server_name _;

    # Landing page
    root /usr/share/nginx/html;
    index index.html;

    location = / {
        try_files /index.html =404;
    }

    location /assets/ {
        try_files $uri =404;
    }

    # Redirect /week1 to /week1/ (trailing slash required for relative paths)
    location = /week1 {
        return 301 /week1/;
    }

    # Week 1 — strip /week1 prefix before proxying
    location /week1/ {
        proxy_pass http://week1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Redirect /week2 to /week2/
    location = /week2 {
        return 301 /week2/;
    }

    # Week 2 — strip /week2 prefix before proxying
    location /week2/ {
        proxy_pass http://week2/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE support for autoplay endpoint
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Health check for Coolify
    location = /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
