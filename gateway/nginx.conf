upstream week1 {
    server week1:8001;
}

upstream week2 {
    server week2:8002;
}

map $http_x_forwarded_proto $real_scheme {
    default $scheme;
    https   https;
}

server {
    listen 80;
    server_name _;

    # Landing page
    root /usr/share/nginx/html;
    index index.html;

    location = / {
        try_files /index.html =404;
    }

    location /assets/ {
        try_files $uri =404;
    }

    # Redirect /week1 to /week1/llm-api-playground/
    location = /week1 {
        return 301 $real_scheme://$host/week1/llm-api-playground/;
    }

    # Week 1 index redirect
    location = /week1/ {
        return 301 $real_scheme://$host/week1/llm-api-playground/;
    }

    # Redirect without trailing slash
    location = /week1/llm-api-playground {
        return 301 $real_scheme://$host/week1/llm-api-playground/;
    }

    # Week 1 — LLM API Playground
    location /week1/llm-api-playground/ {
        proxy_pass http://week1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $real_scheme;
    }

    # Redirect /week2 to /week2/rag-document-qa/
    location = /week2 {
        return 301 $real_scheme://$host/week2/rag-document-qa/;
    }

    # Week 2 index redirect
    location = /week2/ {
        return 301 $real_scheme://$host/week2/rag-document-qa/;
    }

    # Redirect without trailing slash
    location = /week2/rag-document-qa {
        return 301 $real_scheme://$host/week2/rag-document-qa/;
    }

    # Week 2 — RAG Document Q&A
    location /week2/rag-document-qa/ {
        proxy_pass http://week2/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $real_scheme;

        # SSE support for autoplay endpoint
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Health check for Coolify
    location = /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
