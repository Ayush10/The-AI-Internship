services:
  nginx:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "8000:80"
    depends_on:
      week1:
        condition: service_healthy
      week2:
        condition: service_healthy

  week1:
    build:
      context: .
      dockerfile: week1/Dockerfile
    env_file:
      - .env
    environment:
      - BASE_PATH=/week1
    expose:
      - "8001"
    volumes:
      - week1_data:/app/data.db

  week2:
    build:
      context: .
      dockerfile: week2/Dockerfile
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - BASE_PATH=/week2
    expose:
      - "8002"
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - chroma_data:/app/chroma_db

  ollama:
    image: ollama/ollama:latest
    expose:
      - "11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /bin/ollama serve &
        sleep 10
        ollama pull glm-5:cloud
        ollama pull qwen3-embedding
        wait
    deploy:
      resources:
        limits:
          memory: 16G

volumes:
  week1_data:
  chroma_data:
  ollama_data:
