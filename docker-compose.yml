services:
  nginx:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    expose:
      - "80"
    depends_on:
      week1:
        condition: service_healthy
      week2:
        condition: service_healthy

  week1:
    build:
      context: .
      dockerfile: week1/Dockerfile
    env_file:
      - .env
    environment:
      - BASE_PATH=/week1
    expose:
      - "8001"
    volumes:
      - week1_data:/app/data.db

  week2:
    build:
      context: .
      dockerfile: week2/Dockerfile
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - BASE_PATH=/week2
    expose:
      - "8002"
    depends_on:
      ollama:
        condition: service_started
    volumes:
      - chroma_data:/app/chroma_db

  ollama:
    image: ollama/ollama:latest
    expose:
      - "11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 16G

volumes:
  week1_data:
  chroma_data:
  ollama_data:
