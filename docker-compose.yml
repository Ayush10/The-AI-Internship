services:
  nginx:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    expose:
      - "80"
    depends_on:
      week1:
        condition: service_healthy
      week2:
        condition: service_healthy
      week3-nexus:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.aiinternship-http.entryPoints=http"
      - "traefik.http.routers.aiinternship-http.rule=Host(`theaiinternship.ayushojha.com`)"
      - "traefik.http.routers.aiinternship-http.middlewares=redirect-to-https"
      - "traefik.http.routers.aiinternship.entryPoints=https"
      - "traefik.http.routers.aiinternship.rule=Host(`theaiinternship.ayushojha.com`)"
      - "traefik.http.routers.aiinternship.tls=true"
      - "traefik.http.routers.aiinternship.tls.certresolver=letsencrypt"
      - "traefik.http.routers.aiinternship.service=aiinternship"
      - "traefik.http.services.aiinternship.loadbalancer.server.port=80"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
    networks:
      - coolify
      - internal

  week1:
    build:
      context: .
      dockerfile: week1/Dockerfile
    env_file:
      - .env
    environment:
      - BASE_PATH=/week1/llm-api-playground
    expose:
      - "8001"
    volumes:
      - week1_data:/app/data.db
    networks:
      - coolify
      - internal

  week2:
    build:
      context: .
      dockerfile: week2/Dockerfile
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - BASE_PATH=/week2/rag-document-qa
    expose:
      - "8002"
    depends_on:
      ollama:
        condition: service_started
    volumes:
      - chroma_data:/app/chroma_db
    networks:
      - internal

  week3-nexus:
    build:
      context: .
      dockerfile: week3/assignment-1/nexus/Dockerfile
    env_file:
      - .env
    environment:
      - BASE_PATH=/week3/nexus
      - RETURNS_A2A_URL=http://localhost:8001
    expose:
      - "8003"
    networks:
      - coolify
      - internal

  ollama:
    image: ollama/ollama:latest
    expose:
      - "11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:11434/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 16G
    networks:
      - internal

networks:
  coolify:
    external: true
  internal:

volumes:
  week1_data:
  chroma_data:
  ollama_data:
